<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="NeuroNav helps learners with ADHD start, sustain and finish useful revision sessions." />
    <meta name="theme-color" content="#202A25" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>NeuroNav</title>
    <script>
      // Apply saved display settings before first paint to avoid a flash of the wrong theme.
      (function () {
        var s = {};
        try { s = JSON.parse(localStorage.getItem('neuronav_settings_v2') || '{}') || {}; } catch (e) {}
        var mq = function (q) { return window.matchMedia && window.matchMedia(q).matches; };
        var r = document.documentElement.dataset;
        var mono = s.theme === 'ink-light' || s.theme === 'ink-dark';
        r.theme = s.theme === 'dark' || s.theme === 'ink-dark' || ((!s.theme || s.theme === 'system') && mq('(prefers-color-scheme: dark)')) ? 'dark' : 'light';
        r.palette = mono ? 'mono' : s.theme === 'ocean' ? 'ocean' : 'forest';
        r.contrast = mono || s.contrast === 'high' || ((!s.contrast || s.contrast === 'system') && mq('(prefers-contrast: more)')) ? 'high' : s.contrast === 'more' ? 'more' : 'standard';
        r.motion = s.motion === 'reduced' || (s.motion !== 'full' && mq('(prefers-reduced-motion: reduce)')) ? 'reduced' : 'full';
        if (s.font) r.font = s.font;
        if (s.fontSize) r.size = s.fontSize;
        if (s.spacing) r.spacing = s.spacing;
        r.cardTexture = r.contrast === 'high' || s.simplified ? 'off' : ['mixed', 'contours', 'dots', 'linen', 'grid', 'off'].includes(s.cardTexture) ? s.cardTexture : 'mixed';
        r.textureStrength = ['subtle', 'balanced', 'defined'].includes(s.textureStrength) ? s.textureStrength : 'subtle';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>NeuroNav needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
